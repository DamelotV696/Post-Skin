<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Доска объявлений</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="bg-dark text-white p-3 d-flex justify-content-between align-items-center">
        <h1 class="h4 m-0">Доска объявлений</h1>
        <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#adModal">
            Добавить объявление
        </button>
    </header>

    <div class="container mt-3">
        <div class="row g-2 mb-3">
            <div class="col-md-4">
                <input type="text" id="search" class="form-control" placeholder="Поиск по названию">
            </div>
            <div class="col-md-4">
                <select id="filterCategory" class="form-select">
                    <option value="all">Все категории</option>
                    <option value="Техника">Техника</option>
                    <option value="Животные">Животные</option>
                </select>
            </div>
            <div class="col-md-4">
                <select id="sortPrice" class="form-select">
                    <option value="">Сортировка по цене</option>
                    <option value="asc">По возрастанию</option>
                    <option value="desc">По убыванию</option>
                </select>
            </div>
        </div>
        <div class="main-container" id="mainContainer">
            <div id="adsContainer">
                <div class="text-center text-muted py-5 fs-5">Нет объявлений</div>
            </div>
        </div>
    </div>
    <div class="modal" tabindex="-1" id="adModal">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Создание объявления</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form>
                        <div class="mb-3">
                            <label for="exampleInputEmail1" class="form-label">Имя</label>
                            <input type="text" class="form-control" id="postName" name="name">
                        </div>
                        <div class="mb-3">
                            <label for="exampleInputEmail1" class="form-label">Описание</label>
                            <input type="text" class="form-control" id="postDescription" name="description">
                        </div>
                        <div class="mb-3">
                            <label for="exampleInputEmail1" class="form-label">Цена</label>
                            <input type="number" class="form-control" id="postPrice" name="price">
                        </div>
                        <div class="mb-3">
                            <label for="exampleInputEmail1" class="form-label">URL фона</label>
                            <input type="text" class="form-control" id="imgUrl" name="imgUrl">
                        </div>
                        <div class="mb-3">
                            <label for="exampleInputEmail1" class="form-label">Категории</label>
                            <select class="form-select" id="category">
                                <option value="1">Техника</option>
                                <option value="2">Животные</option>
                            </select>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Закрыть</button>
                    <button type="button" class="btn btn-primary" id="addPosts">Добавить</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
